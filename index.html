<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ Mobile | VIP Connect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-base: #050505; 
      --card-bg: #121212; 
      --card-border: #262626;
      
      --btn-bg: #1a1a1a;
      --btn-border: #333333;
      --btn-hover: #222222;
      
      --text-main: #ffffff; 
      --text-soft: #a1a1aa;
      
      --success: #10b981;
      --success-alpha: rgba(16, 185, 129, 0.15);
      
      --radius-md: 14px;
      --radius-lg: 24px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; 
      padding: 35px 16px 50px;
    }

    .header { width: 100%; max-width: 480px; text-align: center; margin-bottom: 28px;}
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; margin: 0; letter-spacing: -0.5px;}
    h1 span { 
      background: linear-gradient(90deg, #d4af37, #f3e5ab); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      font-style: normal; 
    }
    .subtitle { font-size: 14px; color: var(--text-soft); margin-top: 6px; font-weight: 500;}

    .card {
      background: var(--card-bg); 
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      width: 100%; max-width: 480px; 
      padding: 24px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .branch-select {
      width: 100%; padding: 16px; border-radius: var(--radius-md);
      background: var(--btn-bg); color: var(--text-main);
      border: 1px solid var(--btn-border); font-size: 15px; font-weight: 600;
      font-family: inherit; outline: none; margin-bottom: 6px;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a1a1aa%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 18px;
    }
    .branch-select:focus { border-color: #555; }

    .action-btn {
      font-family: 'Inter', sans-serif;
      background: var(--btn-bg); 
      border: 1px solid var(--btn-border);
      border-radius: var(--radius-md); 
      padding: 14px 16px; width: 100%; 
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: all 0.2s ease;
    }
    .action-btn:active { transform: scale(0.97); }
    
    .btn-content { display: flex; align-items: center; gap: 14px; }
    
    .btn-icon {
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #fff;
    }
    .btn-icon svg { width: 22px; height: 22px; fill: currentColor; }
    
    .icon-map   { background: #F5B400; } 
    .icon-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); } 
    .icon-yt    { background: #FF0000; } 
    .icon-fb    { background: #1877F2; } 
    .icon-wa    { background: #25D366; } 
    
    .btn-text-group { text-align: left; display: flex; flex-direction: column; gap: 3px;}
    .btn-title { font-size: 15px; font-weight: 700; color: var(--text-main); letter-spacing: 0.2px;}
    .btn-subtitle { font-size: 12px; font-weight: 500; color: var(--text-soft);}
    
    .status-icon { color: var(--text-soft); font-weight: 600;}

    .action-btn.done { background: var(--success-alpha); border-color: var(--success); }
    .action-btn.done .btn-title, .action-btn.done .btn-subtitle, .action-btn.done .status-icon { color: var(--success); }
    .action-btn.done .btn-icon { background: var(--success); color: #fff; }

    #toast { 
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); 
      background: #ffffff; color: #000000; 
      font-size: 14px; font-weight: 700; padding: 14px 24px; border-radius: 50px; 
      opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 100; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .divider { height: 1px; background: var(--card-border); margin: 6px 0; }
  </style>
</head>
<body>

      <div class="btn-content">

        </div>

          <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

  </div>

  <div id="toast"></div>

  <script>
    const emojis = ['🔥','📱','😍','👍','🙌','⭐','😊','💯'];
    const reviewsData = {
      intros: ["rj mobile ki dukan ek number h","{loc} ki sabse top mobile shop","showroom mast saja rakha h in logo ne","best mobile shop h {loc} area me","yaha aake alag hi maza aata h","bhaiya ki shop kafi badiya h"],
      middles: ["staff bahut polite h","customer service ekdam zordar lgi","bhaiya ne sab kuch pyar se samjhaya","purane phone ka data copy kar diya easily","team kafi friendly h yaha ki","sab log ache se baat karte h"],
      pricing: ["deals sabse best milti h idhar","rate market me sabse saste h","online se bhi kam price me pad gya","exchange value achi lagayi bhaiya ne","emi aasan h aur jaldi ho gyi","budget me badiya phone dila diya"],
      endings: ["sath me free cover glass bhi de diya","gifts dene me kanjoosi ni karte","earphones bhi free me diye","mujhe kafi extra saman de diya sath","bina mange hi free accessories laga di"],
      bonuses: ["sbko 100% recommend karunga","jarur aana bhai logo yaha","mai to hamesha yahi se lunga ab","ekdam paisa vasool jagah h","phone lene ke liye sabse best shop h"]
    };

    function pickReview(branchName) {
      const loc = branchName.split(',')[0].trim();
      let intro = reviewsData.intros[Math.floor(Math.random() * reviewsData.intros.length)].replace(/\{loc\}/g, loc);
      let mid = reviewsData.middles[Math.floor(Math.random() * reviewsData.middles.length)];
      let price = reviewsData.pricing[Math.floor(Math.random() * reviewsData.pricing.length)];
      let end = reviewsData.endings[Math.floor(Math.random() * reviewsData.endings.length)];
      let bonus = reviewsData.bonuses[Math.floor(Math.random() * reviewsData.bonuses.length)];
      
      let text = [intro, mid, price, end, bonus].join(" ").toLowerCase(); 
      text += " " + emojis[Math.floor(Math.random()*emojis.length)] + emojis[Math.floor(Math.random()*emojis.length)];
      return text;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function markDone(btn) {
      btn.classList.add('done');
      const titleSpan = btn.querySelector('.btn-title');
      const iconSpan = btn.querySelector('.status-icon');
      if(!titleSpan.innerHTML.includes('✓')) {
        titleSpan.innerHTML = '✓ ' + titleSpan.innerHTML;
      }
      iconSpan.textContent = '✓';
    }

    function doReview() {
      const btn = document.getElementById('btn-review');
      const select = document.getElementById('branch-select');
      const branchName = select.options[select.selectedIndex].text.replace('📍 ', '');
      const mapLink = select.value;
      
      const text = pickReview(branchName);

      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);

      markDone(btn);
      showToast('Review Text Copied!');

      setTimeout(() => {
        // _blank forces native App opening or a new tab securely.
        window.open(mapLink, '_blank'); 
      }, 500);
    }

    function doAction(btn, url) {
      markDone(btn);
      // Opens universally supported links directly in Native apps, avoids webview trapping.
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
