<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ Mobile | Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-base: #050505; --card-bg: #121212; --card-border: #262626;
      --btn-bg: #1a1a1a; --btn-border: #333333; --text-main: #ffffff; --text-soft: #a1a1aa;
      --success: #10b981; --success-alpha: rgba(16, 185, 129, 0.15);
      --radius-md: 14px; --radius-lg: 24px;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-base); color: var(--text-main);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 35px 16px 50px;
    }
    .header { width: 100%; max-width: 480px; text-align: center; margin-bottom: 28px; display: flex; flex-direction: column; align-items: center; }
    .brand-logo {
      width: 72px; height: 72px; object-fit: contain; margin-bottom: 12px; border-radius: 16px;
      background: #1a1a1a; padding: 8px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 28px; letter-spacing: -0.5px; }
    h1 span { background: linear-gradient(90deg, #d4af37, #f3e5ab); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .subtitle { font-size: 14px; color: var(--text-soft); margin-top: 6px; font-weight: 500; }
    .card {
      background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); width: 100%; max-width: 480px; padding: 24px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .branch-select {
      width: 100%; padding: 16px; border-radius: var(--radius-md); background-color: var(--btn-bg); color: var(--text-main);
      border: 1px solid var(--btn-border); font-size: 16px; font-weight: 600; font-family: inherit; outline: none; margin-bottom: 6px;
      -webkit-appearance: none; appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a1a1aa%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat; background-position: right 16px center; background-size: 18px;
    }
    a.action-btn {
      text-decoration: none; color: inherit; font-family: inherit; background: var(--btn-bg); border: 1px solid var(--btn-border);
      border-radius: var(--radius-md); padding: 14px 16px; width: 100%; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: all 0.2s ease; -webkit-tap-highlight-color: transparent;
    }
    a.action-btn:active { transform: scale(0.97); }
    .btn-content { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .btn-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
    .btn-icon svg { width: 22px; height: 22px; fill: currentColor; }
    .icon-map { background: #F5B400; }
    .icon-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    .icon-yt { background: #FF0000; } .icon-fb { background: #1877F2; } .icon-wa { background: #25D366; }
    .btn-text-group { text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .btn-title { font-size: 15px; font-weight: 700; color: var(--text-main); letter-spacing: 0.2px; }
    .btn-subtitle { font-size: 12px; font-weight: 500; color: var(--text-soft); }
    .status-icon { color: var(--text-soft); font-weight: 600; padding-left: 8px; }
    a.action-btn.done { background: var(--success-alpha); border-color: var(--success); }
    a.action-btn.done .btn-title, a.action-btn.done .btn-subtitle, a.action-btn.done .status-icon { color: var(--success); }
    a.action-btn.done .btn-icon { background: var(--success); color: #fff; }
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #ffffff; color: #000000; font-size: 14px; font-weight: 700; padding: 14px 24px; border-radius: 50px;
      opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: calc(100vw - 32px); text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .divider { height: 1px; background: var(--card-border); margin: 6px 0; }
    .progress { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--text-soft); }
    .bar { flex: 1; height: 6px; background: var(--btn-border); border-radius: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--success); transition: width 0.3s; }
    .tools { display: flex; justify-content: flex-end; }
    .link-btn { background: none; border: 0; color: var(--text-soft); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px 0; }
    #manual { display: none; flex-direction: column; gap: 10px; background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: var(--radius-md); padding: 14px; }
    #manual p { font-size: 12px; color: var(--text-soft); line-height: 1.5; }
    #manual textarea { width: 100%; min-height: 96px; background: #0d0d0d; color: var(--text-main); border: 1px solid var(--btn-border); border-radius: 10px; padding: 10px; font: inherit; font-size: 16px; resize: none; }
    .branch-select option, .branch-select optgroup { background: #1a1a1a; color: #ffffff; }
    .branch-select option:disabled { color: #71717a; }
    .branch-single { display: none; padding: 14px 16px; border-radius: var(--radius-md); background: var(--btn-bg); border: 1px solid var(--btn-border); font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .soon-card { display: none; padding: 16px; border-radius: var(--radius-md); background: var(--btn-bg); border: 1px dashed var(--btn-border); text-align: center; }
    .soon-card strong { display: block; font-size: 15px; margin-bottom: 4px; }
    .soon-card span { font-size: 12px; color: var(--text-soft); line-height: 1.5; }
    #manual button { background: #F5B400; color: #000; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo.png" alt="RJ Mobile" class="brand-logo" onerror="this.style.display='none'" />
    <h1>RJ Mobile <span>Connect</span></h1>
    <div class="subtitle">Select your branch and complete the steps below</div>
  </div>

  <div class="card">
    <div class="progress">
      <span id="prog-text">0/0 done</span>
      <div class="bar"><i id="prog-bar"></i></div>
    </div>

    <select id="branch-select" class="branch-select" aria-label="Select branch"></select>
    <div id="branch-single" class="branch-single"></div>
    <div id="soon" class="soon-card"></div>

    <a id="btn-review" data-key="review" data-title="Google Maps Review" href="#" class="action-btn">
      <div class="btn-content">
        <div class="btn-icon icon-map"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
        <div class="btn-text-group">
          <span class="btn-title">Google Maps Review</span>
          <span class="btn-subtitle">Review text is copied automatically</span>
        </div>
      </div>
      <span class="status-icon">➔</span>
    </a>

    <div id="manual">
      <p>Automatic copy isn't available on this device. Press and hold the text below to copy it, then tap "Open Google Maps".</p>
      <textarea id="manual-text" readonly></textarea>
      <button type="button" id="manual-go">Open Google Maps</button>
    </div>

    <div class="divider"></div>
    <div id="social-list" style="display:contents"></div>

    <div class="tools"><button type="button" class="link-btn" id="reset-btn">Reset progress</button></div>
  </div>

  <div id="toast"></div>

  <script>
    /* ============ ACCOUNTS ============
       Main: "RJ Mobile" | City: "RJ Mobile - {City}"
       Churu / Rajgarh handles are assumed - change if different. */
    const MAIN = { id: 'main', name: 'RJ Mobile', ig: 'rjmobile.in', fb: 'rjmobile.in' };
    const CITIES = [
      { id: 'jaipur',  name: 'RJ Mobile - Jaipur',  ig: 'rjmobile.jaipur',  fb: 'rjmobile.jaipur' },
      { id: 'churu',   name: 'RJ Mobile - Churu',   ig: 'rjmobile.churu',   fb: 'rjmobile.churu' },
      { id: 'rajgarh', name: 'RJ Mobile - Rajgarh', ig: 'rjmobile.rajgarh', fb: 'rjmobile.rajgarh' }
    ];
    const YT_URL = 'https://www.youtube.com/@rjmobileindia/shorts';
    const WA_URL = 'https://whatsapp.com/channel/0029VbCYXVB545v1l2Bme81S';

    const ICONS = {
      ig: '<path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>',
      yt: '<path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>',
      fb: '<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>',
      wa: '<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.487-1.761-1.663-2.06-.177-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>'
    };

    /* ============ URL PARAMS ============
       ?city=all            -> main + every city
       ?city=jaipur         -> main + Jaipur
       ?city=jaipur,churu   -> main + Jaipur + Churu  (comma / space / | all work)
       (no city)            -> main only
       ?branch=vki6         -> preselect review branch
       ?branch=jaipur       -> same as ?city=jaipur for the review branch list
       The review branch list follows the city: ?city=jaipur shows only Jaipur branches,
       ?city=rajgarh only Sadalpur, no city / ?city=all shows every branch. */
    const params = new URLSearchParams(window.location.search);
    const cityList = (params.get('city') || '').toLowerCase().split(/[,\s|]+/).filter(Boolean);
    const showAll = cityList.includes('all');
    const activeCities = showAll ? CITIES : CITIES.filter(c => cityList.includes(c.id));
    const accounts = [MAIN, ...activeCities];

    /* ============ SAVED STATE (localStorage, safe) ============ */
    const STORE_KEY = 'rjmobile_vip_done_v1';
    function loadDone() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
    }
    function saveDone(obj) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {}
    }
    let doneState = loadDone();

    /* ============ APP-FRIENDLY LINKS ============
       Android: an intent:// link opens the main app (Instagram / Facebook / WhatsApp) directly.
       If that app isn't installed (e.g. only a Lite / Business version), the browser_fallback_url (web link) opens
       instead of an install prompt. iPhone / desktop: regular https links. */
    const isAndroid = /Android/i.test(navigator.userAgent);
    function androidIntent(hostPath, pkg, fallback) {
      return 'intent://' + hostPath + '#Intent;scheme=https;package=' + pkg +
             ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
    }

    function btn(key, platform, webHref, appHref, title, sub) {
      const useApp = isAndroid && appHref;
      const href = useApp ? appHref : webHref;
      const target = useApp ? '' : ' target="_blank" rel="noopener"';
      return `<a href="${href}"${target} class="action-btn" data-key="${key}" data-title="${title}">
        <div class="btn-content">
          <div class="btn-icon icon-${platform === 'ig' ? 'insta' : platform}"><svg viewBox="0 0 24 24">${ICONS[platform]}</svg></div>
          <div class="btn-text-group"><span class="btn-title">${title}</span><span class="btn-subtitle">${sub}</span></div>
        </div><span class="status-icon">➔</span></a>`;
    }

    function renderSocial() {
      let h = '';
      accounts.forEach(a => {
        const web = `https://www.instagram.com/${a.ig}/`;
        h += btn('ig:' + a.id, 'ig', web, androidIntent('instagram.com/_u/' + a.ig, 'com.instagram.android', web),
                 `Instagram · ${a.name}`, `@${a.ig} · Follow + Like + Add to Story`);
      });
      accounts.forEach(a => {
        const web = `https://www.facebook.com/${a.fb}/`;
        h += btn('fb:' + a.id, 'fb', web, androidIntent('www.facebook.com/' + a.fb, 'com.facebook.katana', web),
                 `Facebook · ${a.name}`, 'Follow + Like');
      });
      h += btn('yt', 'yt', YT_URL, null, 'YouTube', 'Subscribe + Like');
      h += '<div class="divider"></div>';
      h += btn('wa', 'wa', WA_URL, androidIntent('whatsapp.com/channel/0029VbCYXVB545v1l2Bme81S', 'com.whatsapp', WA_URL),
               'WhatsApp Channel', 'Join for updates & offers');
      document.getElementById('social-list').innerHTML = h;

      document.querySelectorAll('#social-list a.action-btn').forEach(el => {
        el.addEventListener('click', () => setDone(el, true));
      });
    }

    /* ============ DONE + PROGRESS ============ */
    function allButtons() { return document.querySelectorAll('a.action-btn[data-key]'); }

    function paintDone(el, on) {
      const title = el.querySelector('.btn-title');
      el.classList.toggle('done', on);
      title.textContent = (on ? '✓ ' : '') + el.dataset.title;
      el.querySelector('.status-icon').textContent = on ? '✓' : '➔';
    }

    function updateProgress() {
      const els = allButtons();
      let n = 0;
      els.forEach(el => { if (doneState[el.dataset.key]) n++; });
      document.getElementById('prog-text').textContent = n + '/' + els.length + ' done';
      document.getElementById('prog-bar').style.width = (els.length ? (n / els.length) * 100 : 0) + '%';
      return { n, total: els.length };
    }

    function setDone(el, on) {
      doneState[el.dataset.key] = on;
      if (!on) delete doneState[el.dataset.key];
      saveDone(doneState);
      paintDone(el, on);
      const p = updateProgress();
      if (on && p.total && p.n === p.total) showToast('All steps complete. Thank you! 🎉');
    }

    function restoreDone() {
      allButtons().forEach(el => paintDone(el, !!doneState[el.dataset.key]));
      updateProgress();
    }

    /* ============ BRANCHES ============
       Paste the DCM Google review link below. Until then DCM stays out of the list.
       Add a link-less city/branch to UPCOMING to show it as "Coming soon". */
    const DCM_REVIEW_URL = '';

    const BRANCH_CITIES = { jaipur: 'Jaipur', rajgarh: 'Rajgarh', churu: 'Churu' };
    const BRANCHES = [
      { id: 'dcm',          city: 'jaipur',  name: 'DCM',            url: DCM_REVIEW_URL, alias: [] },
      { id: 'jhotwara',     city: 'jaipur',  name: 'Jhotwara',       url: 'https://g.page/r/CRDRHW_oEFkqEBM/review', alias: [] },
      { id: 'murlipura',    city: 'jaipur',  name: 'Murlipura',      url: 'https://g.page/r/CXJpKGVjH1_xEBM/review', alias: ['murlipura1'] },
      { id: 'shastrinagar', city: 'jaipur',  name: 'Shastri Nagar',  url: 'https://g.page/r/CTZC43cDH7SuEBM/review', alias: [] },
      { id: 'lohamandi',    city: 'jaipur',  name: 'Loha Mandi',     url: 'https://search.google.com/local/writereview?placeid=ChIJ7wWKoB-zbTkRuoxnfdku9EQ', alias: ['vkilohamandi'] },
      { id: 'vki6',         city: 'jaipur',  name: 'VKI, Road 6',    url: 'https://g.page/r/CZbxO8pvx8u8EBM/review', alias: [] },
      { id: 'vki17',        city: 'jaipur',  name: 'VKI, Road 17',   url: 'https://g.page/r/CQOTwy2wHbcVEBM/review', alias: [] },
      { id: 'sadalpur',     city: 'rajgarh', name: 'Sadalpur',       url: 'https://g.page/r/CVu708z0OM1PEBM/review', alias: ['rajgarh'] }
    ];
    const UPCOMING = [
      { city: 'jaipur', name: 'Raja Park' },
      { city: 'churu',  name: 'Churu' }
    ];

    /* ============ REVIEW GENERATOR ============
       Each tap builds a different natural Hinglish review:
       visit reason (phone / accessories / repair) + 1-3 specific points + closer.
       Occasionally (not every time) it adds how the customer found the shop,
       and in some reviews ONE light keyword line (service + area + city + brand).
       Recent reviews are remembered so the same text never repeats. */
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
    const PHONES = ['iPhone', 'Samsung', 'Vivo', 'Oppo', 'Realme', 'OnePlus', 'Redmi', 'new smartphone', 'naya phone'];
    const ACCESSORIES = ['cover', 'tempered glass', 'charger', 'earbuds', 'power bank', 'cable'];
    const EMOJI = ['👍', '🔥', '📱', '😊', '🙌', '💯', '⭐', '👌'];

    const SOURCE_CHANCE = 0.15;   // how often "how I found the shop" is mentioned
    const KEYWORD_CHANCE = 0.4;   // how often a keyword line is added

    // Why the customer came (weights: phone 4, accessories 2, repair 2)
    const SCENARIOS = [
      { w: 4, kw: ['mobile shop', 'mobile showroom', 'mobile phone store'],
        openers: [
          "{place} me naya {phone} lena tha, RJ Mobile se liya",
          "phone upgrade karna tha to RJ Mobile {area} visit kiya",
          "pehle online dekh raha tha {phone}, fir RJ Mobile {area} aaya",
          "Visited RJ Mobile {area} to buy a {phone}",
          "RJ Mobile {area} se {phone} liya last week",
          "dost ke bolne pe RJ Mobile {area} gaya {phone} lene"
        ],
        points: [
          "staff ne saare models ache se dikhaye, koi pressure nahi diya",
          "bhaiya ne features samjhaye aur budget ke hisab se hi phone suggest kiya",
          "purane phone ka data bhi transfer kar diya",
          "price market se kam laga aur pakka GST bill mila",
          "exchange me purane phone ki sahi value mili",
          "EMI process easy tha, zyada paperwork nhi",
          "original product mila, full warranty ke sath",
          "showroom saaf suthra h aur latest models available h",
          "customer service achhi lagi, jaldi kaam ho gya"
        ] },
      { w: 2, kw: ['mobile accessories shop', 'mobile accessories store'],
        openers: [
          "{accessory} lene gaya tha RJ Mobile {area}",
          "phone ke liye {accessory} chahiye tha, RJ Mobile {area} se liya",
          "Bought a {accessory} from RJ Mobile {area}",
          "{area} me accessories ke liye RJ Mobile try kiya"
        ],
        points: [
          "bahut saari variety mili, sab brands ke accessories ek hi jagah",
          "quality original lagi aur rate reasonable the",
          "staff ne mere phone model ke hisab se sahi fit diya",
          "tempered glass bhi achhe se laga diya",
          "bhaiya ne honestly bataya konsa lena chahiye aur konsa nahi",
          "market se sahi daam me mil gaya"
        ] },
      { w: 2, kw: ['mobile repair shop', 'mobile repairing center', 'mobile repair service'],
        openers: [
          "phone ki screen toot gayi thi, RJ Mobile {area} me repair karwayi",
          "mera phone repair karwana tha, RJ Mobile {area} gaya",
          "battery ki problem thi, RJ Mobile {area} pe dikhaya",
          "Got my phone repaired at RJ Mobile {area}"
        ],
        points: [
          "pehle problem check ki fir honest price bataya",
          "repair jaldi ho gaya, time pe phone mil gaya",
          "genuine parts use kiye aur warranty bhi mili",
          "data safe raha, koi tension nhi hui",
          "phone ab bilkul new jaisa chal raha h",
          "bina wajah ka extra kharcha nahi karwaya"
        ] }
    ];

    // How the customer found the shop (rare)
    const SOURCES = [
      "Instagram pe RJ Mobile ki reel dekhi thi",
      "YouTube shorts me RJ Mobile dekha tha",
      "Facebook reel dekh ke aaya",
      "ek dost ne refer kiya tha",
      "bhai ke recommend karne pe gaya"
    ];

    // Keyword line: service + place + brand
    const KW_LINES = [
      "best {kw} in {place} - RJ Mobile",
      "RJ Mobile is a trusted {kw} in {place}",
      "{kw} in {place} dhundh rahe ho to RJ Mobile try karo",
      "ek number {kw} in {place}, RJ Mobile"
    ];

    const CLOSERS = [
      "recommend karunga",
      "next time bhi yahi se lunga",
      "family ko bhi yahi bhejunga",
      "5 star deserve karte h",
      "thanks RJ Mobile team",
      "keep it up"
    ];

    const recentReviews = [];
    function weightedScenario() {
      let r = Math.random() * SCENARIOS.reduce((s, x) => s + x.w, 0);
      for (const s of SCENARIOS) { if ((r -= s.w) < 0) return s; }
      return SCENARIOS[0];
    }

    function buildReview(branchName) {
      const branch = BRANCHES.find(b => b.name === branchName);
      const area = branchName.split(',')[0].trim();
      const city = branch ? BRANCH_CITIES[branch.city] : '';
      const place = (city && city !== area && Math.random() < 0.75) ? area + ', ' + city : area;
      const ctx = { area, city, place, phone: pick(PHONES), accessory: pick(ACCESSORIES) };

      const s = weightedScenario();
      const parts = [];
      if (Math.random() < SOURCE_CHANCE) parts.push(pick(SOURCES));
      parts.push(pick(s.openers));
      const openerIdx = parts.length - 1;

      // Sometimes a short review (no detail points), otherwise 2-3 points
      if (Math.random() >= 0.2) parts.push(...shuffle(s.points).slice(0, Math.random() < 0.55 ? 2 : 3));

      // One light keyword line, right after the opener or at the end
      if (Math.random() < KEYWORD_CHANCE) {
        const kwLine = pick(KW_LINES).replace('{kw}', pick(s.kw));
        parts.splice(Math.random() < 0.5 ? openerIdx + 1 : parts.length, 0, kwLine);
      }
      parts.push(pick(CLOSERS));

      let text = parts.join(Math.random() < 0.6 ? '. ' : ', ');
      text = text.replace(/\{(\w+)\}/g, (m, k) => ctx[k] || '');
      if (Math.random() < 0.5) text = text.charAt(0).toUpperCase() + text.slice(1);
      text = Math.random() < 0.45 ? text.replace(/\.$/, '') : (/[.!]$/.test(text) ? text : text + '.');
      const n = Math.random() < 0.3 ? 0 : (Math.random() < 0.6 ? 1 : 2);
      if (n) text += ' ' + shuffle(EMOJI).slice(0, n).join('');
      return text;
    }

    function pickReview(branchName) {
      let text = '';
      for (let i = 0; i < 15; i++) {
        text = buildReview(branchName);
        if (!recentReviews.includes(text)) break;
      }
      recentReviews.push(text);
      if (recentReviews.length > 25) recentReviews.shift();
      return text;
    }

    const norm = v => String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '');

    // Fills the branch dropdown for the current ?city= / ?branch= and returns false when there is no branch to review yet.
    function renderBranches() {
      const select = document.getElementById('branch-select');
      const single = document.getElementById('branch-single');
      const soonBox = document.getElementById('soon');
      const bpn = norm(params.get('branch'));

      let cities = cityList.filter(c => BRANCH_CITIES[c]);
      if (!cities.length && BRANCH_CITIES[bpn]) cities = [bpn];
      const inScope = c => !cities.length || cities.includes(c);

      const list = BRANCHES.filter(b => b.url && inScope(b.city));
      const soon = UPCOMING.filter(u => inScope(u.city));

      if (!list.length) {
        select.style.display = 'none';
        document.getElementById('btn-review').remove();
        soonBox.innerHTML = '<strong>' + (soon.length ? soon.map(u => u.name).join(', ') + ' branch coming soon' : 'Branches coming soon') + '</strong>' +
                            '<span>Reviews will open here once the branch is live. You can follow us on social media meanwhile.</span>';
        soonBox.style.display = 'block';
        return false;
      }

      const makeOpt = (text, value, id, disabled) => {
        const o = document.createElement('option');
        o.textContent = '📍 ' + text;
        if (value) o.value = value;
        if (id) o.dataset.branch = id;
        if (disabled) o.disabled = true;
        return o;
      };

      const cityKeys = Object.keys(BRANCH_CITIES).filter(k => list.some(b => b.city === k) || soon.some(u => u.city === k));
      cityKeys.forEach(k => {
        const parent = cityKeys.length > 1 ? Object.assign(document.createElement('optgroup'), { label: BRANCH_CITIES[k] }) : select;
        list.filter(b => b.city === k).forEach(b => parent.appendChild(makeOpt(b.name, b.url, b.id, false)));
        soon.filter(u => u.city === k).forEach(u => parent.appendChild(makeOpt(u.name + ' (Coming soon)', '', '', true)));
        if (parent !== select) select.appendChild(parent);
      });

      // Preselect from ?branch= (id, old alias, or part of the name)
      if (bpn && !BRANCH_CITIES[bpn]) {
        const hit = list.find(b => norm(b.id) === bpn || b.alias.some(a => norm(a) === bpn) || norm(b.name) === bpn) ||
                    (bpn.length >= 3 ? list.find(b => norm(b.name).includes(bpn)) : null);
        if (hit) select.value = hit.url;
      }
      if (select.selectedIndex < 0 || select.options[select.selectedIndex].disabled) {
        const first = Array.from(select.options).findIndex(o => !o.disabled);
        select.selectedIndex = first;
      }

      // Only one branch to choose from: show it as a label instead of a dropdown
      if (list.length === 1 && !soon.length) {
        single.textContent = '📍 ' + list[0].name;
        single.style.display = 'block';
        select.style.display = 'none';
      }
      return true;
    }

    /* ============ TOAST ============ */
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    /* ============ CLIPBOARD (modern API first, then fallback) ============ */
    function legacyCopy(text) {
      let ok = false;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
      document.body.appendChild(ta);
      try {
        // iOS Safari needs contentEditable + explicit range selection
        ta.contentEditable = 'true';
        ta.readOnly = false;
        const range = document.createRange();
        range.selectNodeContents(ta);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        ta.setSelectionRange(0, text.length);
        ta.focus();
        ok = document.execCommand('copy');
      } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(() => true).catch(() => legacyCopy(text));
      }
      return Promise.resolve(legacyCopy(text));
    }

    /* ============ REVIEW BUTTON ============
       Copy -> toast -> open the Maps link in the SAME tab (not a new tab) so the Google Maps app or the
       logged-in browser handles it. Progress is saved for when the user returns. */
    let pendingUrl = '';
    function openMaps(url) { window.location.href = url; }

    function doReview(ev) {
      ev.preventDefault();
      const el = ev.currentTarget;
      const select = document.getElementById('branch-select');
      const url = select.value;
      const branchName = select.options[select.selectedIndex].text.replace('📍 ', '');
      const text = pickReview(branchName);
      const manual = document.getElementById('manual');
      manual.style.display = 'none';

      copyText(text).then(ok => {
        setDone(el, true);
        if (ok) {
          showToast('Review copied. Paste it on Google Maps.');
          setTimeout(() => openMaps(url), 700);
        } else {
          pendingUrl = url;
          const ta = document.getElementById('manual-text');
          ta.value = text;
          manual.style.display = 'flex';
          ta.focus(); ta.select();
          try { ta.setSelectionRange(0, text.length); } catch (e) {}
          showToast("Couldn't copy. Please copy the text below.");
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSocial();

      const select = document.getElementById('branch-select');
      const reviewBtn = document.getElementById('btn-review');
      if (renderBranches()) {
        reviewBtn.href = select.value;
        select.addEventListener('change', e => { reviewBtn.href = e.target.value; });
        reviewBtn.addEventListener('click', doReview);
      }
      document.getElementById('manual-go').addEventListener('click', () => openMaps(pendingUrl || select.value));
      document.getElementById('reset-btn').addEventListener('click', () => {
        doneState = {}; saveDone(doneState);
        document.getElementById('manual').style.display = 'none';
        restoreDone();
        showToast('Progress has been reset');
      });

      restoreDone();
    });

    // Refresh saved state when returning via the back button (bfcache)
    window.addEventListener('pageshow', e => { if (e.persisted) { doneState = loadDone(); restoreDone(); } });
  </script>
</body>
</html>
